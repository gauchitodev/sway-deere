# =============================================================================
# Capa G5 (estilo John Deere) — se carga al FINAL de la config de Carlos.
# Para apagarla: comentá la línea "include" al final de ~/.config/sway/config
# y recargá con Super+Shift+C.
# =============================================================================

# Colores de ventanas: borde, fondo, texto, indicador, borde del hijo
client.focused          #367c2b #367c2b #ffffff #ffde00 #367c2b
client.focused_inactive #3a352f #3a352f #b2a894 #3a352f #3a352f
client.unfocused        #2f2b26 #2f2b26 #b2a894 #2f2b26 #2f2b26
client.urgent           #ffde00 #ffde00 #1b211c #ffde00 #ffde00
default_border pixel 3
default_floating_border pixel 3

# Lo que depende de cada compu (rutas completas) lo genera instalar.sh en local/
include ~/.config/g5/local/barra.conf

# Pantalla de inicio con paneles: Super+G la muestra y la esconde
bindsym $mod+g exec ~/.config/g5/home/inicio.sh
exec_always ~/.config/g5/home/arrancar.sh
# La pantalla de inicio es una capa encima de tu escritorio (el scratchpad de sway), no un escritorio aparte
for_window [app_id="^chrome-127\.0\.0\.1"] border none, floating enable, move scratchpad
# Si se abre otra ventana o cambiás de escritorio, la capa se esconde sola
exec_always sh ~/.config/g5/home/vigilar.sh

# Fondo de pantalla: la S770 al atardecer
output "*" bg ~/.config/g5/fondo.jpg fill

# Teclado numérico: que arranque con Bloq Num prendido
input type:keyboard xkb_numlock enabled

# Tecla de calculadora (arriba del teclado numérico): Calculadora G5.
# Si ya está abierta la trae al frente; si ya estaba al frente, la cierra.
bindsym XF86Calculator exec ~/.config/g5/calculadora/abrir.sh
for_window [title="^Calculadora G5$"] floating enable, resize set 380 620, move position center

# Wifi: Super+Shift+W (o tocar el wifi en la barra) abre la ventana de redes
bindsym $mod+Shift+w exec ~/.config/g5/wifi/abrir.sh
for_window [app_id="^chrome-localhost__wifi-Default$"] floating enable, resize set 480 660, move position center
